name: Compilar VST3 Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'reaper/**'
      - 'resources/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - '.github/workflows/build-vst3.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio con submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar CMake
        run: cmake -S . -B build -DSAP_BUILD_TESTS=ON -DSAP_BUILD_VST3=ON -DSAP_BUILD_PROTOTYPE=ON

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Ejecutar pruebas DSP
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Empaquetar VST3 + prototipos REAPER
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package/SmartAlignPost | Out-Null

          $vst3 = Get-ChildItem -Path build -Filter '*.vst3' -Recurse | Select-Object -First 1
          if (-not $vst3) { throw 'No se encontró ningún archivo .vst3' }
          Copy-Item -Recurse $vst3.FullName artifacts/package/SmartAlignPost/

          $exe = 'build/Release/SmartAlignPostPrototype.exe'
          if (-not (Test-Path $exe)) { throw "No se encontró $exe" }
          Copy-Item $exe artifacts/package/SmartAlignPost/

          $luaBatch = 'reaper/Smart Align Post - PHASE BATCH.lua'
          if (-not (Test-Path $luaBatch)) { throw "No se encontró $luaBatch" }
          Copy-Item $luaBatch artifacts/package/SmartAlignPost/

          $luaResidual = 'reaper/Smart Align Post - RESIDUAL BY ITEM.lua'
          if (-not (Test-Path $luaResidual)) { throw "No se encontró $luaResidual" }
          Copy-Item $luaResidual artifacts/package/SmartAlignPost/

          $required = @(
            'SmartAlignPostPrototype.exe',
            'Smart Align Post - PHASE BATCH.lua',
            'Smart Align Post - RESIDUAL BY ITEM.lua'
          )

          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'artifacts/package/SmartAlignPost' $name))) {
              throw "Falta en el paquete: $name"
            }
          }

          Compress-Archive -Path artifacts/package/SmartAlignPost -DestinationPath artifacts/SmartAlignPost-Windows-VST3-Prototype.zip

      - name: Verificar ZIP final
        shell: pwsh
        run: |
          $zip = 'artifacts/SmartAlignPost-Windows-VST3-Prototype.zip'
          if (-not (Test-Path $zip)) { throw 'No se generó el ZIP final' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))

          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }

            $expected = @(
              'SmartAlignPost/SmartAlignPostPrototype.exe',
              'SmartAlignPost/Smart Align Post - PHASE BATCH.lua',
              'SmartAlignPost/Smart Align Post - RESIDUAL BY ITEM.lua'
            )

            foreach ($entry in $expected) {
              if ($names -notcontains $entry) {
                throw "El ZIP no contiene: $entry"
              }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SmartAlignPost-Windows-VST3-Prototype
          path: artifacts/SmartAlignPost-Windows-VST3-Prototype.zip
